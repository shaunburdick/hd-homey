name: Dependency Review

on:
    pull_request:
        branches: [main, develop]
        paths-ignore:
            - 'apps/docs/**'
            - '.github/workflows/docs.yml'

permissions:
    contents: read
    pull-requests: write

jobs:
    dependency-review:
        name: Review Dependencies
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Dependency Review
              uses: actions/dependency-review-action@v5
              with:
                  # Fail on moderate or higher severity vulnerabilities
                  fail-on-severity: moderate
                  # Allowlist of permissive licenses common in the Node.js ecosystem.
                  # Using allow-licenses (allowlist) instead of deny-licenses (denylist)
                  # since an allowlist is harder to accidentally circumvent with new
                  # copyleft variants (deny-licenses was also deprecated in v4).
                  allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, CC0-1.0, CC-BY-3.0, CC-BY-4.0, BlueOak-1.0.0, 0BSD, Unlicense, Python-2.0
                  comment-summary-in-pr: always
