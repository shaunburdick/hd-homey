name: Dependency Review

on:
    pull_request:
        branches: [main, develop]
        paths-ignore:
            - 'docs/**'
            - '.github/workflows/docs.yml'

permissions:
    contents: read
    pull-requests: write

jobs:
    dependency-review:
        name: Review Dependencies
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Dependency Review
              uses: actions/dependency-review-action@v4
              with:
                  # Fail on critical or high severity vulnerabilities
                  fail-on-severity: moderate
                  # Deny licenses that are restrictive or incompatible
                  # Note: AGPL-3.0 (project license) is compatible with most OSS licenses
                  deny-licenses: GPL-2.0, LGPL-2.0, LGPL-2.1
                  comment-summary-in-pr: always
