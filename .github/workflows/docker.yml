name: Docker

on:
    push:
        branches: [main]
        tags:
            - "v*.*.*"
        paths-ignore:
            - "**.md"
            - ".specs/**"
            - ".specify/**"
            - "LICENSE"
            - ".vscode/**"
            - "apps/docs/**"
            - "apps/android/**"
            - ".github/workflows/test.yml"
            - ".github/workflows/docs.yml"
            - ".github/workflows/codeql.yml"
            - ".github/workflows/dependency-review.yml"
    pull_request:
        branches: [main]
        paths-ignore:
            - "**.md"
            - ".specs/**"
            - ".specify/**"
            - "LICENSE"
            - ".vscode/**"
            - "apps/docs/**"
            - "apps/android/**"
            - ".github/workflows/test.yml"
            - ".github/workflows/docs.yml"
            - ".github/workflows/codeql.yml"
            - ".github/workflows/dependency-review.yml"
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    build-amd64:
        name: Build and Push Docker Image (linux/amd64)
        runs-on: ubuntu-24.04
        permissions:
            contents: write
            packages: write
            attestations: write
            id-token: write
        timeout-minutes: 30
        outputs:
            digest: ${{ steps.build.outputs.digest }}
        steps:
            - name: Checkout
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - name: Set up Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
              with:
                  node-version: "22"

            - name: Generate version.json with Git metadata
              working-directory: apps/web
              run: |
                  node scripts/generate-version.mjs
                  echo "Generated version.json:"
                  cat version.json
              env:
                  NODE_ENV: production

            - name: Set up QEMU
              uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
              with:
                  # Use BuildKit cache for faster builds
                  driver-opts: |
                      image=moby/buildkit:latest
                      network=host

            - name: Log in to GitHub Container Registry
              if: github.event_name != 'pull_request'
              uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      # Tag with branch name
                      type=ref,event=branch
                      # Tag with PR number
                      type=ref,event=pr
                      # Tag with semver from git tags
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}
                      # Tag with sha for traceability (branch pushes only)
                      type=sha,prefix={{branch}}-,enable={{is_default_branch}}
                      # Latest tag for default branch
                      type=raw,value=latest,enable={{is_default_branch}}
                  labels: |
                      org.opencontainers.image.title=HD Homey
                      org.opencontainers.image.description=HDHomeRun tuner management and streaming
                      org.opencontainers.image.vendor=Shaun Burdick

            - name: Build and push Docker image by digest
              id: build
              uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
              with:
                  context: .
                  file: ./apps/web/Dockerfile
                  platforms: linux/amd64
                  labels: ${{ steps.meta.outputs.labels }}
                  # Push by digest for multi-platform manifest creation
                  outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
                  # Use platform-specific cache for better performance
                  cache-from: type=gha,scope=build-linux/amd64
                  cache-to: type=gha,mode=max,scope=build-linux/amd64
                  # Build arguments
                  build-args: |
                      BUILDTIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
                      VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
                      REVISION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
                  # Optimize build with provenance
                  provenance: mode=max
                  sbom: false

            - name: Export digest
              if: github.event_name != 'pull_request'
              run: |
                  mkdir -p ${{ runner.temp }}/digests
                  digest="${{ steps.build.outputs.digest }}"
                  touch "${{ runner.temp }}/digests/${digest#sha256:}"

            - name: Upload digest
              if: github.event_name != 'pull_request'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: digests-linux-amd64
                  path: ${{ runner.temp }}/digests/*
                  if-no-files-found: error
                  retention-days: 1

            - name: Generate SBOM
              if: github.event_name != 'pull_request'
              uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
              with:
                  image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
                  format: spdx-json
                  output-file: sbom.spdx.json

            - name: Upload SBOM
              if: github.event_name != 'pull_request'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: sbom-amd64
                  path: sbom.spdx.json
                  retention-days: 90

    push-image:
        name: Push Docker Image Tags
        needs: [build-amd64]
        runs-on: ubuntu-latest
        if: github.event_name != 'pull_request'
        permissions:
            contents: read
            packages: write
        steps:
            - name: Download digests
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  path: ${{ runner.temp }}/digests
                  pattern: digests-*
                  merge-multiple: true

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}
                      type=sha,prefix={{branch}}-,enable={{is_default_branch}}
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Create and push image tags
              working-directory: ${{ runner.temp }}/digests
              run: |
                  docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
                    $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)
              env:
                  DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
