name: Docker

on:
    push:
        branches: [main]
        tags:
            - "v*.*.*"
        paths-ignore:
            - "**.md"
            - ".specs/**"
            - "LICENSE"
            - ".vscode/**"
            - ".github/workflows/test.yml"
            - ".github/workflows/codeql.yml"
            - ".github/workflows/dependency-review.yml"
    pull_request:
        branches: [main]
        paths-ignore:
            - "**.md"
            - ".specs/**"
            - "LICENSE"
            - ".vscode/**"
            - ".github/workflows/test.yml"
            - ".github/workflows/codeql.yml"
            - ".github/workflows/dependency-review.yml"
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    build-amd64:
        name: Build and Push Docker Image (linux/amd64)
        runs-on: ubuntu-24.04
        permissions:
            contents: write
            packages: write
            attestations: write
            id-token: write
        timeout-minutes: 30
        outputs:
            digest: ${{ steps.build.outputs.digest }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
              with:
                  # Use BuildKit cache for faster builds
                  driver-opts: |
                      image=moby/buildkit:latest
                      network=host

            - name: Log in to GitHub Container Registry
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      # Tag with branch name
                      type=ref,event=branch
                      # Tag with PR number
                      type=ref,event=pr
                      # Tag with semver from git tags
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}
                      # Tag with sha for traceability
                      type=sha,prefix={{branch}}-
                      # Latest tag for default branch
                      type=raw,value=latest,enable={{is_default_branch}}
                  labels: |
                      org.opencontainers.image.title=HD Homey
                      org.opencontainers.image.description=HDHomeRun tuner management and streaming
                      org.opencontainers.image.vendor=Shaun Burdick

            - name: Build and push Docker image by digest
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: linux/amd64
                  labels: ${{ steps.meta.outputs.labels }}
                  # Push by digest for multi-platform manifest creation
                  outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
                  # Use platform-specific cache for better performance
                  cache-from: type=gha,scope=build-linux/amd64
                  cache-to: type=gha,mode=max,scope=build-linux/amd64
                  # Build arguments
                  build-args: |
                      BUILDTIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
                      VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
                      REVISION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
                  # Optimize build with provenance
                  provenance: mode=max
                  sbom: false

            - name: Export digest
              if: github.event_name != 'pull_request'
              run: |
                  mkdir -p ${{ runner.temp }}/digests
                  digest="${{ steps.build.outputs.digest }}"
                  touch "${{ runner.temp }}/digests/${digest#sha256:}"

            - name: Upload digest
              if: github.event_name != 'pull_request'
              uses: actions/upload-artifact@v4
              with:
                  name: digests-linux-amd64
                  path: ${{ runner.temp }}/digests/*
                  if-no-files-found: error
                  retention-days: 1

            - name: Generate SBOM
              if: github.event_name != 'pull_request'
              uses: anchore/sbom-action@v0
              with:
                  image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
                  format: spdx-json
                  output-file: sbom.spdx.json

            - name: Upload SBOM
              if: github.event_name != 'pull_request'
              uses: actions/upload-artifact@v4
              with:
                  name: sbom-amd64
                  path: sbom.spdx.json
                  retention-days: 90

    build-arm64:
        name: Build and Push Docker Image (linux/arm64)
        # Only build ARM64 on release tags
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-24.04
        permissions:
            contents: write
            packages: write
            attestations: write
            id-token: write
        timeout-minutes: 60  # ARM64 emulation is slower
        outputs:
            digest: ${{ steps.build.outputs.digest }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
              with:
                  # Use BuildKit cache for faster builds
                  driver-opts: |
                      image=moby/buildkit:latest
                      network=host

            - name: Log in to GitHub Container Registry
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      # Tag with branch name
                      type=ref,event=branch
                      # Tag with PR number
                      type=ref,event=pr
                      # Tag with semver from git tags
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}
                      # Tag with sha for traceability
                      type=sha,prefix={{branch}}-
                      # Latest tag for default branch
                      type=raw,value=latest,enable={{is_default_branch}}
                  labels: |
                      org.opencontainers.image.title=HD Homey
                      org.opencontainers.image.description=HDHomeRun tuner management and streaming
                      org.opencontainers.image.vendor=Shaun Burdick

            - name: Build and push Docker image by digest
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: linux/arm64
                  labels: ${{ steps.meta.outputs.labels }}
                  # Push by digest for multi-platform manifest creation
                  outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
                  # Use platform-specific cache for better performance
                  cache-from: type=gha,scope=build-linux/arm64
                  cache-to: type=gha,mode=max,scope=build-linux/arm64
                  # Build arguments
                  build-args: |
                      BUILDTIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
                      VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
                      REVISION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
                  # Optimize build with provenance
                  provenance: mode=max
                  sbom: false

            - name: Export digest
              if: github.event_name != 'pull_request'
              run: |
                  mkdir -p ${{ runner.temp }}/digests
                  digest="${{ steps.build.outputs.digest }}"
                  touch "${{ runner.temp }}/digests/${digest#sha256:}"

            - name: Upload digest
              if: github.event_name != 'pull_request'
              uses: actions/upload-artifact@v4
              with:
                  name: digests-linux-arm64
                  path: ${{ runner.temp }}/digests/*
                  if-no-files-found: error
                  retention-days: 1

            - name: Generate SBOM
              if: github.event_name != 'pull_request'
              uses: anchore/sbom-action@v0
              with:
                  image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
                  format: spdx-json
                  output-file: sbom.spdx.json

            - name: Upload SBOM
              if: github.event_name != 'pull_request'
              uses: actions/upload-artifact@v4
              with:
                  name: sbom-arm64
                  path: sbom.spdx.json
                  retention-days: 90

    merge-manifests:
        name: Merge Multi-Platform Manifests
        needs: [build-amd64, build-arm64]
        runs-on: ubuntu-latest
        # Always run if amd64 succeeds, even if arm64 is skipped
        if: |
            always() &&
            needs.build-amd64.result == 'success' &&
            (needs.build-arm64.result == 'success' || needs.build-arm64.result == 'skipped') &&
            github.event_name != 'pull_request'
        permissions:
            contents: read
            packages: write
        steps:
            - name: Download digests
              uses: actions/download-artifact@v4
              with:
                  path: ${{ runner.temp }}/digests
                  pattern: digests-*
                  merge-multiple: true

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}
                      type=sha,prefix={{branch}}-
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Create and push multi-platform manifest
              working-directory: ${{ runner.temp }}/digests
              run: |
                  docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
                    $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)
              env:
                  DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
