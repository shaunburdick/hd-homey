name: Release

on:
    push:
        tags:
            - "v*.*.*"
    workflow_dispatch:
        inputs:
            version:
                description: "Version to release (e.g., v1.0.0)"
                required: true
                type: string

permissions:
    contents: write
    packages: write
    attestations: write
    id-token: write

jobs:
    # First validate the build
    validate:
        name: Validate Release
        uses: ./.github/workflows/test.yml

    # Create GitHub Release
    create-release:
        name: Create GitHub Release
        runs-on: ubuntu-latest
        needs: validate
        timeout-minutes: 10
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - name: Checkout
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
              with:
                  fetch-depth: 0

            - name: Extract version
              id: version
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    VERSION="${{ github.event.inputs.version }}"
                  else
                    VERSION="${GITHUB_REF#refs/tags/}"
                  fi
                  echo "version=$VERSION" >> $GITHUB_OUTPUT
                  echo "Version: $VERSION"

            - name: Extract changelog for version
              id: changelog
              run: |
                  VERSION="${{ steps.version.outputs.version }}"
                  # Remove 'v' prefix if present
                  VERSION_NUM="${VERSION#v}"
                  
                  # Extract the section for this version from CHANGELOG.md
                  # This finds the section between ## [VERSION] and the next ## [
                  CHANGELOG=$(awk '/^## \['"$VERSION_NUM"'\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md)
                  
                  if [ -z "$CHANGELOG" ]; then
                    echo "Warning: No changelog found for version $VERSION_NUM in CHANGELOG.md"
                    CHANGELOG="Release $VERSION_NUM"
                  fi
                  
                  # Save to file for multiline content
                  echo "$CHANGELOG" > /tmp/changelog.txt

            - name: Build release body
              run: |
                  VERSION="${{ steps.version.outputs.version }}"
                  
                  # Create release body with changelog and Docker instructions
                  cat /tmp/changelog.txt > /tmp/release-body.txt
                  echo "" >> /tmp/release-body.txt
                  echo "---" >> /tmp/release-body.txt
                  echo "" >> /tmp/release-body.txt
                  echo "## 🐳 Docker Images" >> /tmp/release-body.txt
                  echo "" >> /tmp/release-body.txt
                  echo "Pull the Docker image:" >> /tmp/release-body.txt
                  echo '```bash' >> /tmp/release-body.txt
                  echo "docker pull ghcr.io/${{ github.repository }}:$VERSION" >> /tmp/release-body.txt
                  echo "docker pull ghcr.io/${{ github.repository }}:latest" >> /tmp/release-body.txt
                  echo '```' >> /tmp/release-body.txt
                  echo "" >> /tmp/release-body.txt
                  echo "## 📦 Installation" >> /tmp/release-body.txt
                  echo "" >> /tmp/release-body.txt
                  echo "See the [README](https://github.com/${{ github.repository }}/blob/main/README.md) for installation instructions." >> /tmp/release-body.txt

            - name: Publish Release
              uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
              with:
                  tag_name: ${{ steps.version.outputs.version }}
                  name: Release ${{ steps.version.outputs.version }}
                  body_path: /tmp/release-body.txt
                  prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'rc') }}

    # Build Docker images are handled by docker.yml workflow on tag push
