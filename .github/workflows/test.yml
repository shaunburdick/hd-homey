name: CI

on:
    push:
        branches: [main, develop]
        paths-ignore:
            - 'apps/docs/**'
            - '.github/workflows/docs.yml'
    pull_request:
        branches: [main, develop]
        paths-ignore:
            - 'apps/docs/**'
            - '.github/workflows/docs.yml'
    workflow_dispatch:
    workflow_call:

# Cancel in-progress runs for the same workflow and ref
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    NODE_VERSION: "20"
    JAVA_VERSION: "17"

jobs:
    # Lint job runs independently for fast feedback
    lint:
        name: Lint
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Checkout
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - name: Setup Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Install root dependencies
              run: npm ci --prefer-offline

            - name: Run ESLint (web)
              working-directory: apps/web
              run: npm run lint

            - name: Run ESLint (docs)
              working-directory: apps/docs
              run: npm run lint

    # Type checking job runs in parallel with tests
    typecheck:
        name: Type Check
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Checkout
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - name: Setup Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Install root dependencies
              run: npm ci --prefer-offline

            - name: Generate Next.js types
              working-directory: apps/web
              run: npx next typegen

            - name: Run TypeScript compiler
              working-directory: apps/web
              run: npx tsc --noEmit

    # Test job with coverage
    test:
        name: Test
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - name: Setup Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Install root dependencies
              run: npm ci --prefer-offline

            - name: Run tests with coverage
              working-directory: apps/web
              run: npm run test:coverage

            - name: Upload coverage reports
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: coverage-report
                  path: apps/web/coverage/
                  retention-days: 7

    # Android lint job runs in parallel for fast feedback
    android-lint:
        name: Android Lint
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - name: Setup JDK
              uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5
              with:
                  distribution: 'temurin'
                  java-version: ${{ env.JAVA_VERSION }}
                  cache: 'gradle'

            - name: Grant execute permission for gradlew
              working-directory: apps/android
              run: chmod +x gradlew

            - name: Run Android Lint
              working-directory: apps/android
              run: ./gradlew lintDebug

            - name: Upload lint results
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: android-lint-report
                  path: apps/android/app/build/reports/lint-results-debug.html
                  retention-days: 7

    # Android test job runs in parallel
    android-test:
        name: Android Test
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - name: Setup JDK
              uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5
              with:
                  distribution: 'temurin'
                  java-version: ${{ env.JAVA_VERSION }}
                  cache: 'gradle'

            - name: Grant execute permission for gradlew
              working-directory: apps/android
              run: chmod +x gradlew

            - name: Run unit tests
              working-directory: apps/android
              run: ./gradlew testDebugUnitTest

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: android-test-results
                  path: |
                      apps/android/app/build/reports/tests/
                      apps/android/app/build/test-results/
                  retention-days: 7

    # Android instrumentation test job — runs on emulator for UI tests (T103–T105).
    # NOT added to android-build's `needs:` so emulator flakiness cannot block builds.
    android-instrumentation-test:
        name: Android Instrumentation Tests
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - name: Checkout
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - name: Setup JDK
              uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5
              with:
                  distribution: 'temurin'
                  java-version: ${{ env.JAVA_VERSION }}
                  cache: 'gradle'

            - name: Grant execute permission for gradlew
              working-directory: apps/android
              run: chmod +x gradlew

            - name: Enable KVM
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm

            - name: Run instrumentation tests
              uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
              with:
                  api-level: 35
                  target: google_apis
                  arch: x86_64
                  disk-size: 4096M
                  ram-size: 2048M
                  working-directory: apps/android
                  script: ./gradlew connectedDebugAndroidTest --no-daemon

            - name: Upload instrumentation test results
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: android-instrumentation-test-results
                  path: apps/android/app/build/reports/androidTests/
                  retention-days: 7

    # Build job - only runs after lint, typecheck, and test pass
    build:
        name: Build
        runs-on: ubuntu-latest
        needs: [lint, typecheck, test, android-lint, android-test]
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - name: Setup Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Install root dependencies
              run: npm ci --prefer-offline

            - name: Restore Next.js cache
              uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
              with:
                  path: |
                      apps/web/.next/cache
                  key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx', 'apps/web/**/*.js', 'apps/web/**/*.jsx') }}
                  restore-keys: |
                      ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

            - name: Build Next.js application
              working-directory: apps/web
              run: npm run build

            - name: Upload build artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: nextjs-build
                  path: |
                      apps/web/.next/
                      !apps/web/.next/cache
                  retention-days: 7

    # Android build job - only runs after Android checks pass
    android-build:
        name: Android Build
        runs-on: ubuntu-latest
        needs: [android-lint, android-test]
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - name: Setup JDK
              uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5
              with:
                  distribution: 'temurin'
                  java-version: ${{ env.JAVA_VERSION }}
                  cache: 'gradle'

            - name: Grant execute permission for gradlew
              working-directory: apps/android
              run: chmod +x gradlew

            - name: Build debug APK
              working-directory: apps/android
              run: ./gradlew assembleDebug

            - name: Upload APK artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: android-debug-apk
                  path: apps/android/app/build/outputs/apk/debug/app-debug.apk
                  retention-days: 7
