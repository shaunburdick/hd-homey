name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]
    workflow_dispatch:

# Cancel in-progress runs for the same workflow and ref
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    NODE_VERSION: "20"
    SKIP_INSTRUMENTATION: true

jobs:
    # Lint job runs independently for fast feedback
    lint:
        name: Lint
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Install dependencies
              run: npm ci --prefer-offline

            - name: Run ESLint
              run: npm run lint

    # Type checking job runs in parallel with tests
    typecheck:
        name: Type Check
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Install dependencies
              run: npm ci --prefer-offline

            - name: Run TypeScript compiler
              run: npx tsc --noEmit

    # Test job with coverage
    test:
        name: Test
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Install dependencies
              run: npm ci --prefer-offline

            - name: Run tests with coverage
              run: npm run test:coverage

            - name: Upload coverage reports
              if: always()
              uses: actions/upload-artifact@v5
              with:
                  name: coverage-report
                  path: coverage/
                  retention-days: 7

    # Build job - only runs after lint, typecheck, and test pass
    build:
        name: Build
        runs-on: ubuntu-latest
        needs: [lint, typecheck, test]
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Install dependencies
              run: npm ci --prefer-offline

            - name: Restore Next.js cache
              uses: actions/cache@v4
              with:
                  path: |
                      .next/cache
                  key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.js', '**/*.jsx') }}
                  restore-keys: |
                      ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

            - name: Build Next.js application
              run: npm run build

            - name: Upload build artifacts
              uses: actions/upload-artifact@v5
              with:
                  name: nextjs-build
                  path: |
                      .next/
                      !.next/cache
                  retention-days: 7
